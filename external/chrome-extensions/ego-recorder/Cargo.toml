[package]
name = "ego-recorder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ego-rec"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
percent-encoding = "2.3.2"
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ts-rs = "12.0.1"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
