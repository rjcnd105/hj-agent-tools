schema_version: "1.1"
name: splits-lanes-by-ownership
context:
  scaffold_script: place-files.sh
expected_outcome: |
  A plan file in the project with one section per lane (an api lane and a web lane at least), each
  naming disjoint owned paths and pass/fail checkpoints. The shared type file stays with the PO.
  commands.md holds one hc run per lane in the background, each carrying a full brief that tells the
  child its goal, owned paths, checkpoints, not to start agents, and to report with hc send to the PO,
  followed by waiting with hc wait and landing one lane at a time.
