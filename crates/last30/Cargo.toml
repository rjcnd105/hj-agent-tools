[package]
name = "last30"
version = "0.1.0"
edition = "2024"
description = "Fast parallel community pulse collector (HN, GitHub, Bluesky, Reddit, YouTube, X, Threads)"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
jiff = "0.2"
reqwest = { version = "0.13.5", features = ["json", "query", "form", "gzip", "brotli", "zstd", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync", "fs"] }
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
